# Post-obstacle-rescale retune for COOP_NMPC (2026-07-19).
#
# The previous weight study ran with an inert robot obstacle critic: the
# analytic port changed its residual from w * v_raw to sqrt(w) * v/255 and the
# tuned weights were never rescaled. obstacle_weight is now fixed at the
# equal-authority 1463 in the COOP_NMPC profile and is deliberately NOT
# searched here — this study rebalances everything else around it.
#
# Ranges are anchored at the current profile values (mpc_controller.yaml.j2
# crowded block, shown trailing) at roughly [0, 2.5-3x current]. Structural
# ints and sub-weights (angle, goal_align, velocity_feasibility,
# velocity_alignment, crossing_bearing) stay frozen, as in the prior study.

parameters:

  # NAVIGATION baseline
  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.distance_weight
    type: float
    min: 0.0
    max: 20.0            # current 7.0   (path tracking)

  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.goal_proximity_weight
    type: float
    min: 0.0
    max: 15.0            # current 5.0   (goal attraction)

  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.velocity_weight
    type: float
    min: 0.0
    max: 12.0            # current 4.5   (speed tracking)

  # SOCIAL
  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.social_weight
    type: float
    min: 0.0
    max: 75.0            # current 28.0  (SFM force avoidance)

  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.proxemics_weight
    type: float
    min: 0.0
    max: 30.0            # current 10.0  (proximity penalty)

  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.agent_angle_weight
    type: float
    min: 0.0
    max: 45.0            # current 16.0  (don't aim at agents)

  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.crossing_weight
    type: float
    min: 0.0
    max: 60.0            # current 25.0  (yield at crossings)

  # ENLARGED STATE
  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.agent_velocity_reference_weight
    type: float
    min: 0.0
    max: 20.0            # current 8.0   (anchor agent velocities to observations)

  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.agent_sfm_dynamics_weight
    type: float
    min: 0.0
    max: 8.0             # current 2.0   (enforce SFM physics on agent updates)

  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.agent_obstacle_weight
    type: float
    min: 0.0
    max: 5.0             # current 1.5   (penalise agent paths through obstacles)

  # BACKGROUND CROWD
  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.background_agent_weight
    type: float
    min: 0.0
    max: 30.0            # current 10.0  (proxemics on max_agents-truncated humans)
