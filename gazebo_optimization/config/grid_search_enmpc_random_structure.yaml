# Structural follow-up after weight tuning: random_crowded_env has eight agents
# and agent speeds up to 1.0 m/s, versus the profile's 3 / 0.6 defaults.
parameters:
  - path: controller_server.ros__parameters.FollowPath.optimizer.max_agents
    type: int
    min: 3
    max: 8
    values: [3, 8]

  - path: controller_server.ros__parameters.FollowPath.optimizer.agent_velocity_bound
    type: float
    min: 0.6
    max: 1.0
    values: [0.6, 1.0]
