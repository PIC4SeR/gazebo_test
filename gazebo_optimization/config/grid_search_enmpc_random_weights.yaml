# Focused third-stage grid, based on the prior random_crowd studies and the
# cooperation/background sweep. Fixed one-value entries document the anchor.
parameters:
  - path: controller_server.ros__parameters.FollowPath.optimizer.human_cooperation_factor
    type: float
    min: 1.0
    max: 1.0
    values: [1.0]

  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.background_agent_weight
    type: float
    min: 10.0
    max: 10.0
    values: [10.0]

  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.social_weight
    type: float
    min: 20.0
    max: 28.0
    values: [20.0, 28.0]

  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.proxemics_weight
    type: float
    min: 15.0
    max: 22.0
    values: [15.0, 22.0]

  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.velocity_weight
    type: float
    min: 5.0
    max: 5.0
    values: [5.0]

  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.agent_angle_weight
    type: float
    min: 22.0
    max: 22.0
    values: [22.0]

  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.crossing_weight
    type: float
    min: 25.0
    max: 35.0
    values: [25.0, 35.0]
