# Second-stage COOP_NMPC grid for random_crowded_env. Velocity/lookahead and the
# previously tuned social weights remain fixed by the COOP_NMPC profile.
parameters:
  - path: controller_server.ros__parameters.FollowPath.optimizer.human_cooperation_factor
    type: float
    min: 0.3
    max: 1.0
    values: [0.3, 0.7, 1.0]

  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.background_agent_weight
    type: float
    min: 0.0
    max: 20.0
    values: [0.0, 10.0, 20.0]
