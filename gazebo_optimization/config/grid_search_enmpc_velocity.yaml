# COOP_NMPC sweep for cv_crowded_env: 3 velocities x 3 lookaheads = 9 trials.
parameters:
  - name: max_linear_velocity
    paths:
      - controller_server.ros__parameters.FollowPath.max_linear_vel
      - controller_server.ros__parameters.FollowPath.trajectorizer.desired_linear_vel
      - velocity_smoother.ros__parameters.max_velocity.0
    type: float
    min: 0.6
    max: 1.0
    values: [0.6, 0.8, 1.0]

  - path: controller_server.ros__parameters.FollowPath.trajectorizer.lookahead_dist
    type: float
    min: 1.0
    max: 3.0
    values: [1.0, 2.0, 3.0]
