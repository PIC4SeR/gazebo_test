# Search space for the MPC_enlarged_state navigator (plugin: mpc_enlarged_state::MPCEnlargedState)
#
# Format follows §4 of docs/optuna_parameter_tuning.md: each entry is a
# FULLY-QUALIFIED dotted path into the rendered nav2_params.yaml, with an
# explicit type and range. The generalized driver walks the path with
# set_by_path() and samples with trial.suggest_<type>(...).
#
# Base path for every weight below:
#   controller_server.ros__parameters.FollowPath.optimizer.weights.<weight>
#
# MPC_enlarged_state enables ALL critics (social_work, angle, proxemics,
# path_follow, path_align, crossing) — see nav2_profiles/navigators/navigators.yaml:513.
# Therefore the navigation, social, AND enlarged-state weights are all active.
#
# Ranges are anchored around the template defaults (mpc_controller.yaml.j2),
# roughly [0, 2-3x default] per §3.3. Structural ints (control_horizon,
# max_iterations, parameter_block_length, max_agents, ...) are intentionally
# FROZEN and not listed.
#
# The default (rendered) value is shown in the trailing comment for each knob.

parameters:

  # ----------------------------------------------------------------------------
  # NAVIGATION baseline (keep a few so social terms can be traded off against
  # path tracking / goal attraction / obstacle avoidance)
  # ----------------------------------------------------------------------------
  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.distance_weight
    type: float
    min: 0.0
    max: 25.0            # default 10.5  (path tracking)

  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.goal_proximity_weight
    type: float
    min: 0.0
    max: 15.0            # default 5.5   (goal attraction)

  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.obstacle_weight
    type: float
    min: 0.0
    max: 0.20            # default 0.07  (costmap avoidance, peak-normalized small)

  # ----------------------------------------------------------------------------
  # SOCIAL — should dominate navigation when activated
  # ----------------------------------------------------------------------------
  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.social_weight
    type: float
    min: 0.0
    max: 75.0            # default 25.0  (SFM force avoidance)

  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.proxemics_weight
    type: float
    min: 0.0
    max: 30.0            # default 8.0   (proximity penalty)

  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.agent_angle_weight
    type: float
    min: 0.0
    max: 40.0            # default 12.0  (don't aim at agents)

  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.crossing_weight
    type: float
    min: 0.0
    max: 60.0            # default 20.0  (yield at crossings)

  # ----------------------------------------------------------------------------
  # ENLARGED STATE — co-optimised agent state (distinctive to this navigator)
  # ----------------------------------------------------------------------------
  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.agent_velocity_reference_weight
    type: float
    min: 0.0
    max: 15.0            # default 5.0   (keep agent velocities close to observations)

  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.agent_sfm_dynamics_weight
    type: float
    min: 0.0
    max: 8.0             # default 2.0   (enforce SFM physics on agent updates)

  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.agent_obstacle_weight
    type: float
    min: 0.0
    max: 5.0             # default 1.0   (penalise agent paths through obstacles)

  # ----------------------------------------------------------------------------
  # Optional extra knobs — uncomment to widen the search (keeps total to 5-10
  # when commented, per §8 budget guidance). Each is a sub/secondary weight.
  # ----------------------------------------------------------------------------
  # - path: controller_server.ros__parameters.FollowPath.optimizer.weights.angle_weight
  #   type: float
  #   min: 0.0
  #   max: 5.0            # default 1.0   (heading to path)
  # - path: controller_server.ros__parameters.FollowPath.optimizer.weights.goal_align_weight
  #   type: float
  #   min: 0.0
  #   max: 20.0           # default 8.5   (final heading)
  # - path: controller_server.ros__parameters.FollowPath.optimizer.weights.velocity_weight
  #   type: float
  #   min: 0.0
  #   max: 15.0           # default 6.0   (speed tracking)
  # - path: controller_server.ros__parameters.FollowPath.optimizer.weights.velocity_feasibility_weight
  #   type: float
  #   min: 0.0
  #   max: 20.0           # default 9.0   (smoothness)
  # - path: controller_server.ros__parameters.FollowPath.optimizer.weights.velocity_alignment_weight
  #   type: float
  #   min: 0.0
  #   max: 15.0           # default 5.0   (sub-weight of AgentAngleCost)
  # - path: controller_server.ros__parameters.FollowPath.optimizer.weights.crossing_bearing_weight
  #   type: float
  #   min: 0.0
  #   max: 15.0           # default 5.0   (sub-weight of CrossingCost)
