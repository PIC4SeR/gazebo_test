# Scan-corrected safety grid. Keep it small: 3 x 3 x 3 = 27 trials.
parameters:
  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.social_weight
    type: float
    min: 28.0
    max: 55.0
    values: [28.0, 40.0, 55.0]

  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.proxemics_weight
    type: float
    min: 10.0
    max: 30.0
    values: [10.0, 18.0, 30.0]

  - path: controller_server.ros__parameters.FollowPath.optimizer.weights.velocity_weight
    type: float
    min: 2.5
    max: 6.5
    values: [2.5, 4.0, 6.5]
