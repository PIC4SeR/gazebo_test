experiment_manager:
  ros__parameters:
    # Experiment-manager config for OPTUNA TUNING runs (selected via
    # `gazeboexp run ... --exp-config-pkg gazebo_optimization`, which the
    # optuna_optimization driver passes by default).
    #
    # Kept separate from the benchmark packages so tuning can use a low
    # `repetitions` (cheap trials) without mutating the benchmark's reps=30.
    # Restore reps=30 there for final benchmarking; tune here.
    #
    # IF A PARAMETER IS SET IN THE LAUNCH FILE, IT SHOULD NOT BE SET HERE SINCE IT WILL BE OVERRIDDEN BY THE LAUNCH FILE
    use_sim_time: #THIS IS SET IN THE LAUNCH FILE (default: True)
    use_recorder: #THIS IS SET IN THE LAUNCH FILE (default: False)
    use_evaluator: #THIS IS SET IN THE LAUNCH FILE (default: False)
    use_namespace: #THIS IS SET IN THE LAUNCH FILE (default: False)
    record_maps: #THIS IS SET IN THE LAUNCH FILE (default: False)
    wait_before_start: #THIS IS SET IN THE LAUNCH FILE (default: None)
    resume_checkpoint: #THIS IS SET IN THE LAUNCH FILE (default: False)
    checkpoint_dsn: #THIS IS SET IN THE LAUNCH FILE (default: None)
    algorithm_name: "test_algorithm"          # overridden by the driver per trial
    base_path: "/workspaces/hunavsim_devcontainer/results/benchmark_experiments"  # overridden by --base-path-for-results
    timeout_duration: 100.0
    repetitions: 3                             # tuning floor (docs §6); raise for noisier scenarios
    goals_and_poses_file: "/workspaces/hunavsim_ws/src/gazebo_test/gazebo_experiments/goals_and_poses/social_nav.yaml"  # overridden per experiment
