experiments:
  - social_nav
  - social_nav_multirobot
  - social_nav_formation
  - formation_passing
  - formation_passing_tb3
  - perturbation
  - perturbation_tb2
  - social_env_test
  - social_nav_test
  - social_env_7_test
  - social_nav_obstacles
  - social_scenarios

# Optional per-experiment launch helpers can be declared under any experiment:
# additional_launch_files:
#   - "my_pkg my_launch.py arg:=value"
#   - package: my_pkg
#     launch: my_launch.py
#     arguments:
#       arg: value
#
# Optional replacement for the default gazebo_test Nav2 bringup:
# navigation_launch:
#   package: my_nav_pkg
#   launch: my_nav.launch.py
#   arguments:
#     map: "{map}"
#     params_file: "{params_file}"
#
# Optional robot/simulator render overrides passed to the nav2_profiles template
# renderer (a YAML mapping). Resolved against robot_config_pkg_name/config/ when
# the path is relative; defaults to the experiment package. Omit to use the
# gazebo_test sim defaults (odom_topic=ground_truth, people_topic=detected_people,
# bt_xml_pkg=gazebo_test).
# robot_config_file: robot_configs/my_robot.yaml
# robot_config_pkg_name: my_pkg   # optional; defaults to the experiment package
#   # my_robot.yaml contents, e.g.:
#   #   odom_topic: /odometry/filtered
#   #   bt_xml_pkg: my_bt_pkg

social_nav:
  goals_and_poses:
    goals_and_poses/social_nav.yaml
  map:
    maps/social_nav_map.yaml
  world:
    social_nav.world
  world_pkg_name:
    gazebo_sim
  agents_configuration_file:
    agents_envs/social_nav.yaml
  config_pkg_name:
    gazebo_sim
  camera_config_file:
    camera_configs/social_nav.yaml

social_nav_multirobot:
  task:
    multirobot
  goals_and_poses:
    goals_and_poses/social_nav_multirobot.yaml
  map:
    maps/social_nav_map.yaml
  world:
    social_nav.world
  world_pkg_name:
    gazebo_sim
  agents_configuration_file:
    agents_envs/social_nav.yaml
  config_pkg_name:
    gazebo_sim
  camera_config_file:
    camera_configs/social_nav.yaml

social_nav_formation:
  task:
    formation
  goals_and_poses:
    goals_and_poses/social_nav_formation.yaml
  map:
    maps/social_nav_map.yaml
  world:
    social_nav.world
  world_pkg_name:
    gazebo_sim
  agents_configuration_file:
    agents_envs/social_nav.yaml
  config_pkg_name:
    gazebo_sim
  camera_config_file:
    camera_configs/social_nav.yaml
  # Formation-keeping is delegated to swarm_control's hybrid orchestrator
  # (single swarm-level /navigate_to_pose) instead of per-robot Nav2. Its launch
  # is wired to the fleet via the {robots} placeholder (robot names -> ROS
  # namespaces) and each robot's ground-truth odometry.
  navigation_launch:
    package: swarm_control
    launch: hybrid.launch.py
    arguments:
      robots: "{robots}"
      odom_topic: ground_truth
      people_topic: /people
      use_sim_time: "true"

formation_passing:
  task:
    formation
  goals_and_poses:
    goals_and_poses/formation_passing.yaml
  map:
    maps/corridor.yaml
  world:
    corridor.world
  world_pkg_name:
    gazebo_sim
  agents_configuration_file:
    agents_envs/passing/agents.yaml
  config_pkg_name:
    gazebo_sim
  camera_config_file:
    camera_configs/corridor.yaml
  # Two robots hold formation (swarm_control hybrid orchestrator) down the
  # corridor while the passing agents walk the other way. Same swarm wiring as
  # social_nav_formation: one centroid goal -> the orchestrator's
  # /navigate_to_pose, fanned out to the per-robot workers.
  navigation_launch:
    package: swarm_control
    launch: hybrid.launch.py
    arguments:
      robots: "{robots}"
      odom_topic: ground_truth
      people_topic: /people
      use_sim_time: "true"

formation_passing_tb3:
  task:
    formation
  goals_and_poses:
    goals_and_poses/formation_passing_tb3.yaml
  map:
    maps/corridor.yaml
  world:
    corridor.world
  world_pkg_name:
    gazebo_sim
  agents_configuration_file:
    agents_envs/passing/agents.yaml
  config_pkg_name:
    gazebo_sim
  camera_config_file:
    camera_configs/corridor.yaml
  # Three TurtleBot3 burgers (least-sensor variant) hold formation via
  # swarm_control's hybrid orchestrator down the corridor while the passing agents
  # walk the other way. Same swarm wiring as formation_passing, including
  # odom_topic: the turtlebot3 profile injects jackal's pose3d ground-truth plugin,
  # so TB3 publishes map-frame odometry on ground_truth like every other robot.
  # (TB3's diff-drive `odom` is spawn-relative -- each robot's frame origin sits at
  # its own spawn pose -- so the swarm's formation and social terms, which compare
  # robots to each other and to map-frame humans, cannot use it.)
  navigation_launch:
    package: swarm_control
    launch: hybrid.launch.py
    arguments:
      robots: "{robots}"
      odom_topic: ground_truth
      people_topic: /people
      use_sim_time: "true"

formation_crossing:
  task:
    formation
  goals_and_poses:
    goals_and_poses/formation_crossing.yaml
  map:
    maps/experiment.yaml
  map_pkg_name:
    gazebo_experiments
  world:
    experiment_room.world
  world_pkg_name:
    gazebo_sim
  agents_configuration_file:
    agents_envs/crossing/agents.yaml
  config_pkg_name:
    gazebo_sim
  camera_config_file:
    camera_configs/experiment.yaml
  # Two robots hold formation (swarm_control hybrid orchestrator) down the
  # corridor while the passing agents walk the other way. Same swarm wiring as
  # social_nav_formation: one centroid goal -> the orchestrator's
  # /navigate_to_pose, fanned out to the per-robot workers. ground_truth (not the
  # spawn-relative diff-drive odom) is the only map-frame odometry the swarm's
  # formation/social terms can be computed in -- see formation_passing_tb3.
  navigation_launch:
    package: swarm_control
    launch: hybrid.launch.py
    arguments:
      robots: "{robots}"
      odom_topic: ground_truth
      people_topic: /people
      use_sim_time: "true"

perturbation:
  task:
    perturbation
  goals_and_poses:
    goals_and_poses/perturbation.yaml
  map:
    maps/experiment.yaml
  map_pkg_name:
    gazebo_experiments
  world:
    experiment_room.world
  world_pkg_name:
    gazebo_sim
  agents_configuration_file:
    agents_envs/perturbation/agents.yaml
  config_pkg_name:
    gazebo_sim
  camera_config_file:
    camera_configs/experiment.yaml
  # Three TurtleBot3 burgers start in formation and hold their group center
  # steady (swarm_control hybrid orchestrator, one hold-point goal) while the
  # crossing agents push through/around them. Same swarm wiring as
  # formation_crossing; the perturbation task ends the episode once the agents
  # have parked and the swarm is still again. convergence_criterion 'hold' keeps
  # the workers alive all episode -- with the default criterion the orchestrator
  # converges ~1 s in (the swarm starts AT its goal), cancels the workers, and
  # the uncontrolled fleet gets shoved into an instant drift failure.
  # ground_truth (not the spawn-relative diff-drive odom) is the only map-frame
  # odometry the swarm's formation/social terms can be computed in -- see
  # formation_passing_tb3. This matters most here: station-keeping is judged
  # against a map-frame hold point.
  navigation_launch:
    package: swarm_control
    launch: hybrid.launch.py
    arguments:
      robots: "{robots}"
      odom_topic: ground_truth
      people_topic: /people
      use_sim_time: "true"
      convergence_criterion: hold

perturbation_tb2:
  task:
    perturbation
  goals_and_poses:
    goals_and_poses/perturbation_tb2.yaml
  map:
    maps/experiment.yaml
  map_pkg_name:
    gazebo_experiments
  world:
    experiment_room.world
  world_pkg_name:
    gazebo_sim
  agents_configuration_file:
    agents_envs/perturbation_tb2/agents.yaml
  config_pkg_name:
    gazebo_sim
  camera_config_file:
    camera_configs/experiment.yaml
  # Three TurtleBot2 (kobuki) + one Jackal hold their group center (swarm_control
  # hybrid orchestrator, one hold-point goal) while three agents cross the swarm
  # once each from three different directions. Same wiring as `perturbation`,
  # with one difference: the fleet mixes robots with different odometry stacks
  # (tb2's diff-drive odom vs jackal's EKF), so the workers read the pose3d
  # ground_truth topic both profiles publish. convergence_criterion 'hold' keeps
  # the workers alive all episode (the swarm starts AT its goal).
  navigation_launch:
    package: swarm_control
    launch: hybrid.launch.py
    arguments:
      robots: "{robots}"
      odom_topic: ground_truth
      people_topic: /people
      use_sim_time: "true"
      convergence_criterion: hold
      # Social-memory feedback form: "false" -> u = u_robot - k_z*z,
      # "true" -> u = u_robot - k_z*z/||z|| (direction-only versor).
      z_use_versor: "false"

