# Swarm-controller profile matrix. All entries reuse the same TurtleBot2 +
# Jackal perturbation scene; only potential and memory implementations differ.
_perturbation_tb2_profile_base: &perturbation_tb2_profile_base
  task: perturbation
  goals_and_poses: goals_and_poses/perturbation_tb2.yaml
  map: maps/experiment.yaml
  map_pkg_name: gazebo_experiments
  world: experiment_room.world
  world_pkg_name: gazebo_sim
  agents_configuration_file: agents_envs/perturbation_tb2/agents.yaml
  config_pkg_name: gazebo_sim
  camera_config_file: camera_configs/experiment.yaml

_perturbation_tb2_launch_arguments: &perturbation_tb2_launch_arguments
  robots: "{robots}"
  odom_topic: ground_truth
  people_topic: /people
  use_sim_time: "true"
  convergence_criterion: hold

perturbation_tb2_gaussian_off:
  <<: *perturbation_tb2_profile_base
