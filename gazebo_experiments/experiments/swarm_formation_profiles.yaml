_formation_launch_arguments: &formation_launch_arguments
  robots: "{robots}"
  odom_topic: ground_truth
  people_topic: /people
  use_sim_time: "true"

_launch_gaussian_off: &launch_gaussian_off
  package: swarm_control
  launch: hybrid.launch.py
  arguments:
    <<: *formation_launch_arguments
    profile: gaussian
    memory_profile: "off"

_launch_gaussian_raw: &launch_gaussian_raw
  package: swarm_control
  launch: hybrid.launch.py
  arguments:
    <<: *formation_launch_arguments
    profile: gaussian
    memory_profile: raw

