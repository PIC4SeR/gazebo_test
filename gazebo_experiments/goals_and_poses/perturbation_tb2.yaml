# Perturbation scenario, turtlebot2 fleet edition (perturbation task). Four
# robots -- three TurtleBot2 (kobuki) and one Jackal -- start already in
# formation and must hold their GROUP CENTER steady for the whole episode while
# three HuNav agents converge on the origin from three different directions and
# push through the swarm once each (see agents_envs/perturbation_tb2/agents.yaml:
# cyclic_goals false, one crossing goal per agent). As in the tb3 perturbation
# scenario there is no distant centroid to reach: the hold point defaults to the
# mean of each episode's start poses. Success = the swarm survives the full
# timeout window without a collision or a drift violation.
#
# Swarm wiring: swarm_control's hybrid orchestrator with a single fleet-wide
# odom_topic. Jackal has no /<ns>/odom and turtlebot2 has no EKF, but BOTH
# profiles publish the pose3d ground-truth plugin on /<ns>/ground_truth, so
# the experiment reads odom_topic: ground_truth (see experiments.yaml).
robots:
  - name: turtlebot2                  # first robot's name must be a valid model id
    model: turtlebot2                 # (the CLI passes it as robot_name:= for HuNav)
    spawn: [0.0, -1.8, 0.0]           # x, y, theta spawn pose in Gazebo
  - name: turtlebot2_1
    model: turtlebot2
    spawn: [0.0, -0.6, 0.0]
  - name: turtlebot2_2
    model: turtlebot2
    spawn: [0.0, 0.6, 0.0]
  - name: jackal
    model: jackal
    spawn: [0.0, 1.8, 0.0]
goal_name: "goal_box"                 # the held centroid is visualized as this box
map_path: "maps/experiment.yaml"

# Fail the episode if the swarm's live group center (ground-truth, world frame)
# strays more than this many metres from the hold point; polled this often.
# Optional -- these are the task defaults.
drift_tolerance: 0.75                 # metres
drift_poll_period: 0.5                # seconds

episodes:
  - episode_1
  - episode_2
  - episode_3
  - episode_4

# Initial formation per episode (one start pose per robot). The swarm holds this
# relative shape (set by swarm_control's gains) AND keeps its group center fixed
# at the mean of these poses for the whole episode.

poses: # The poses of the robot in x, y, theta
  # 1.2 m between adjacent robots in every formation: enough clearance for the
  # agents (radius 0.4) to slip between robots instead of being forced into them.

  # Column across the corridor, centered on the origin: center = (0, 0).
  episode_1:
    turtlebot2: [0.0, -1.8, 0.0]
    turtlebot2_1: [0.0, -0.6, 0.0]
    turtlebot2_2: [0.0, 0.6, 0.0]
    jackal: [0.0, 1.8, 0.0]

  # Line-abreast along the corridor, centered on the origin: center = (0, 0).
  episode_2:
    turtlebot2: [-1.8, 0.0, 1.57]
    turtlebot2_1: [-0.6, 0.0, 1.57]
    turtlebot2_2: [0.6, 0.0, 1.57]
    jackal: [1.8, 0.0, 1.57]

  # Diamond centered on the origin, jackal at the rear point.
  episode_3:
    turtlebot2: [1.0, 0.0, 3.14]
    turtlebot2_1: [0.0, 1.0, 3.14]
    turtlebot2_2: [0.0, -1.0, 3.14]
    jackal: [-1.0, 0.0, 3.14]

  # Square cluster centered on the origin.
  episode_4:
    turtlebot2: [-0.8, -0.8, 1.57]
    turtlebot2_1: [0.8, -0.8, 1.57]
    turtlebot2_2: [-0.8, 0.8, 1.57]
    jackal: [0.8, 0.8, 1.57]

# 'centroid:' is intentionally omitted -- the perturbation task defaults each
# episode's hold point to the mean of its start poses above.
