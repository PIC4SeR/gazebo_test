# Single-robot goals/poses. Same schema as the multi-robot configs: a
# top-level `robots:` list (here with a single participant) selects fleet
# parsing (parse_fleet_yaml); namespace == robot name. Per episode, goals and
# poses are keyed by robot name.
robots:
  - name: jackal
    model: jackal
    spawn: [-0.3, -4.5, 1.57]

map_path: maps/social_env_test_map.yaml
episodes: 
  - episode_1
  - episode_2

goals:
  episode_1:
    jackal: [-4.0, -5.0]
  episode_2:
    jackal: [4.0, -4.0]

poses:
  episode_1:
    jackal: [-3.5, 1.8, -1.57]
  episode_2:
    jackal: [2.3, 1.4, -1.57]
