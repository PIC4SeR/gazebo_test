# Single-robot goals/poses. Same schema as the multi-robot configs: a
# top-level `robots:` list (here with a single participant) selects fleet
# parsing (parse_fleet_yaml); namespace == robot name. Per episode, goals and
# poses are keyed by robot name.

robots:
  - name: jackal
    model: jackal
    spawn: [-0.3, -4.5, 1.57]

map_path: maps/social_env_test_map.yaml

episodes: 
  - episode_1
  - episode_2
  - episode_3
  - episode_4
  - episode_5
  - episode_6
  - episode_7
  - episode_8
  - episode_9
  - episode_10

goals:
  episode_1:
    jackal: [-5.0, 4.0]
  episode_2:
    jackal: [0.6, 2.0]
  episode_3:
    jackal: [0.6, 4.2]
  episode_4:
    jackal: [0.6, -4.5]
  episode_5:
    jackal: [0.6, -4.5]
  episode_6:
    jackal: [-3.5, -2.4]
  episode_7:
    jackal: [-4.0, -4.0]
  episode_8:
    jackal: [2.5, -1.0]
  episode_9:
    jackal: [4.0, -5.0]
  episode_10:
    jackal: [4.8, -4.8]
    
poses:
  episode_1:
    jackal: [0.6, 4.25, -3.14]
  episode_2:
    jackal: [-0.3, -4.5, 1.57]
  episode_3:
    jackal: [-5.0, 4.25, 0.0]
  episode_4:
    jackal: [0.6, 4.25, -1.57]
  episode_5:
    jackal: [-5.0, 4.25, 0.0]
  episode_6:
    jackal: [-3.5, 1.6, -1.57]
  episode_7:
    jackal: [-3.0, 1.6, -1.57]
  episode_8:
    jackal: [2.5, 4.0, 0.0]
  episode_9:
    jackal: [2.5, 1.4, -1.57]
  episode_10:
    jackal: [4.4, -0.8, -3.14]
