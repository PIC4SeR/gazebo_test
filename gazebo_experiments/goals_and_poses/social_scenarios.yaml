# Single-robot goals/poses. Same schema as the multi-robot configs: a
# top-level `robots:` list (here with a single participant) selects fleet
# parsing (parse_fleet_yaml); namespace == robot name. Per episode, goals and
# poses are keyed by robot name.
robots:
  - name: jackal
    model: jackal
    spawn: [0.0, 1.0, 0.0]
goal_name: goal_box

map_path: maps/social_nav_map.yaml

episodes: 
  - episode_1
  - episode_2
  - episode_3
  - episode_4
  - episode_5
  - episode_6
  - episode_7
  - episode_8
  - episode_9
  - episode_10
  - episode_11
  - episode_12

goals:
  episode_1:
    jackal: [5.0, 9.0]
  episode_2:
    jackal: [6.0, 8.0]
  episode_3:
    jackal: [4.58, 7.0]
  episode_4:
    jackal: [8.0, 7.0]
  episode_5:
    jackal: [7.0, 8.0]
  episode_6:
    jackal: [8.0, 9.0]
  episode_7:
    jackal: [5.0, -6.0]
  episode_8:
    jackal: [6.0, -8.0]
  episode_9:
    jackal: [4.58, -7.0]
  episode_10:
    jackal: [0.08, -7.0]
  episode_11:
    jackal: [0.08, 6.0]
  episode_12:
    jackal: [0.08, -6.0]

poses:
  episode_1:
    jackal: [-4.0, 9.0, 0.0]
  episode_2:
    jackal: [-3.0, 8.0, 0.0]
  episode_3:
    jackal: [-5.0, 7.0, 0.0]
  episode_4:
    jackal: [-8.0, 9.0, 0.0]
  episode_5:
    jackal: [-8.0, 8.0, 0.0]
  episode_6:
    jackal: [-8.0, 7.0, 0.0]
  episode_7:
    jackal: [-8.0, -5.0, 0.0]
  episode_8:
    jackal: [-8.0, -4.0, 0.0]
  episode_9:
    jackal: [-8.0, -3.5, 0.0]
  episode_10:
    jackal: [-0.4, 5.0, -1.57]
  episode_11:
    jackal: [-0.1, -4.0, 1.57]
  episode_12:
    jackal: [0.4, 3.5, -1.57]
