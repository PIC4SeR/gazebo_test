# Explicit per-node keying (instead of /**) so parameters do not leak to
# unrelated nodes. The motion-model selection is read by BOTH the hunav_loader
# and hunav_agent_manager nodes, so it is duplicated under each (keep the two
# copies in sync). The agent definitions are only needed by hunav_loader.
#
# Strategy defaults to 'fixed': every human uses default_motion_model unless it
# has a per-agent `motion_model:` override (all agents here are cv anyway).
# Per-agent overrides only take effect under the 'fixed' strategy, and for the
# manager to honor a per-agent override that differs from the default it must
# also appear under hunav_agent_manager below.
#
# cv = constant velocity: agents head straight to their current goal at their
# desired velocity with no obstacle/social avoidance; it takes no tuning params.

hunav_agent_manager:
  ros__parameters:
    default_motion_model: cv

hunav_loader:
  ros__parameters:
    map: cafe
    publish_people: true
    default_motion_model: cv
    agents:
      - agent1
      - agent2
      - agent3
      - agent4
      - agent5
      - agent6
      - agent7
      - agent8
    agent1:
      id: 1
      skin: 0
      group_id: -1
      max_vel: 0.8
      radius: 0.4
      motion_model: cv
      behavior:
        type: 1
        configuration: 0
        duration: 40.0
        once: true
        vel: 1.0
        dist: 4.5
        goal_force_factor: 2.0
        obstacle_force_factor: 10.0
        social_force_factor: 5.0
        other_force_factor: 20.0
      init_pose:
        x: -4.255916
        y: 7.570549
        z: 1.250000
        h: 0.0
      goal_radius: 0.3
      cyclic_goals: true
