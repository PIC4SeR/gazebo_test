# Impassive crowd: humans use the SFM motion model, but every agent runs the
# HuNav IMPASSIVE behavior (behavior.type: 2) instead of REGULAR (type: 1).
#
# What this changes (see AgentManager::computeForces):
#   regular (1)   -> the robot is injected into the agent's *social* neighbor set,
#                    so humans anticipate it and cooperatively negotiate passage.
#   impassive (2) -> the robot is injected into the agent's *obstacle* set instead.
#                    Humans no longer socially anticipate the robot; they only feel
#                    a short-range repulsion from it, and they still SFM-avoid each
#                    other. This is the non-cooperative ("distracted pedestrian")
#                    baseline: the robot must do the anticipatory work, but humans
#                    will not walk straight through it the way `cv` agents do.
#
# The motion model MUST stay `sfm` here: AgentManager::updatePosition routes every
# agent through its MotionModel unconditionally, and CVModel/ORCAModel ignore the
# computed forces entirely -- so `motion_model: cv` would silently discard the
# impassive obstacle force and behavior.type would have no effect at all.
#
# Agent poses, goals and max_vel are copied verbatim from crowded_env_cv.yaml so
# that cv-vs-impassive isolates reactivity (note these speeds are higher than
# crowded_env.yaml's).

hunav_agent_manager:
  ros__parameters:
    default_motion_model: sfm

hunav_loader:
  ros__parameters:
    map: cafe
    publish_people: true
    default_motion_model: sfm
    agents:
      - agent1
      - agent2
      - agent3
      - agent4
      - agent5
      - agent6
      - agent7
      - agent8
    agent1:
      id: 1
      skin: 0
      group_id: -1
      max_vel: 0.8
      radius: 0.4
      motion_model: sfm
      behavior:
        type: 2
        configuration: 0
        duration: 40.0
        once: true
        vel: 1.0
        dist: 4.5
        goal_force_factor: 2.0
        obstacle_force_factor: 10.0
        social_force_factor: 5.0
        other_force_factor: 20.0
      init_pose:
