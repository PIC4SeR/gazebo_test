# Perturbation agents for the turtlebot2 fleet experiment (perturbation_tb2):
# a LIMITED-TIME disturbance, same schema and behavior parameters as
# agents_envs/perturbation/agents.yaml but with THREE agents converging on the
# origin (where the fleet holds station) from three different directions,
# roughly 120 degrees apart: north, southwest and southeast. Each agent walks
# its single crossing goal exactly once (cyclic_goals: false) and stops on the
# far side -- one transient push through the swarm per direction.
hunav_agent_manager:
  ros__parameters:
    default_motion_model: orca
    orca:
      neighbor_dist: 5.0
      max_neighbors: 10
      time_horizon: 5.0
      time_horizon_obst: 5.0
      obstacle_segment: 0.2

hunav_loader:
  ros__parameters:
    map: cafe
    publish_people: true
    default_motion_model: orca
    orca:
      neighbor_dist: 5.0
      max_neighbors: 10
      time_horizon: 5.0
      time_horizon_obst: 5.0
      obstacle_segment: 0.2
    agents:
      - agent1
      - agent2
      - agent3
    agent1:
      id: 1
      skin: 0
      group_id: -1
      max_vel: 0.8
      radius: 0.4
      behavior:
        type: 1 # REGULAR=1, IMPASSIVE=2, SURPRISED=3, SCARED=4, CURIOUS=5, THREATENING=6
        configuration: 0   # def: 0, custom:1, random_normal:2, random_uniform:3
        duration: 40.0  # seg
        once: true
        vel: 0.4
        dist: 0.0
        goal_force_factor: 2.0
        obstacle_force_factor: 10.0
        social_force_factor: 5.0
        other_force_factor: 20.0
      init_pose:            # from the NORTH, heading south through the origin
        x: 0.0
        y: 5.0
        z: 1.250000
        h: 0.0
      goal_radius: 0.3
      cyclic_goals: false      # cross the swarm once, then stop
      goals:
        - g0
      g0:
        x: 0.0
        y: -4.5
        h: 1.250000
    agent2:
      id: 2
      skin: 1
      group_id: -1
      max_vel: 0.8
      radius: 0.4
      behavior:
        type: 1 # REGULAR=1, IMPASSIVE=2, SURPRISED=3, SCARED=4, CURIOUS=5, THREATENING=6
        configuration: 0   # def: 0, custom:1, random_normal:2, random_uniform:3
        duration: 40.0  # seg
        once: true
        vel: 0.4
        dist: 0.0
        goal_force_factor: 2.0
        obstacle_force_factor: 10.0
        social_force_factor: 5.0
        other_force_factor: 20.0
      init_pose:            # from the SOUTHWEST, heading northeast through the origin
        x: -4.0
        y: -3.2
        z: 1.250000
        h: 0.0
      goal_radius: 0.3
      cyclic_goals: false      # cross the swarm once, then stop
      goals:
        - g0
      g0:
        x: 4.0
        y: 3.2
        h: 1.250000
    agent3:
      id: 3
      skin: 2
      group_id: -1
      max_vel: 0.8
      radius: 0.4
      behavior:
        type: 1 # REGULAR=1, IMPASSIVE=2, SURPRISED=3, SCARED=4, CURIOUS=5, THREATENING=6
        configuration: 0   # def: 0, custom:1, random_normal:2, random_uniform:3
        duration: 40.0  # seg
        once: true
        vel: 0.4
        dist: 0.0
        goal_force_factor: 2.0
        obstacle_force_factor: 10.0
        social_force_factor: 5.0
        other_force_factor: 20.0
      init_pose:            # from the SOUTHEAST, heading northwest through the origin
        x: 4.3
        y: -3.2
        z: 1.250000
        h: 0.0
      goal_radius: 0.3
      cyclic_goals: false      # cross the swarm once, then stop
      goals:
        - g0
      g0:
        x: -4.0
        y: 3.0
        h: 1.250000
