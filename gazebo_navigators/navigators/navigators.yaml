# SICNav (safe-interactive-crowdnav) — MPC bilevel/ORCA-KKT controller.
# Default: 'campc' (no acados/HSL, validated end-to-end). control_frequency
# in the template defaults to 5.0; the de-risk measured ~hundreds of ms per
# solve without HSL, so do not raise unless HSL ma57/ma27 is built into casadi.
# controller_frequency (outer Nav2 loop) MUST equal control_frequency (the MPC
# dt the controller uses). campc/MUMPS solve ≈ hundreds of ms → 5 Hz; HSL would
# allow raising both. sicnav_acados without HSL warmstart needs 3 Hz.
SICNAV:
  nav_template:
    name: only_controller
    controller:
      name: sicnav
      policy_name: "campc"
      # 2 Hz: campc/IPOPT solve measured ~500 ms live (not "hundreds of ms" as the
      # note above assumed), so 5 Hz overran the 200 ms budget ~2.5x and broke the
      # MPC dt-vs-real-time consistency. control_frequency MUST equal
      # controller_frequency (it is the MPC dt). 2 Hz (500 ms budget) matches the
      # solve. Raise only if the solve gets faster (HSL/fewer iters).
      controller_frequency: 2.0
      control_frequency: 2.0
      costmap_layers:
        - obstacle_layer
        - inflation_layer
  additional_launch_files:
    - package: nav2_pybind_sicnav_controller
      launch: costmap_converter.launch.py

# CrowdSimPlus DWA baseline (distinct from the standalone 'DWA' navigator above,
# which uses a different controller package).
SICNAV_DWA:
  nav_template:
    name: only_controller
    controller:
      name: sicnav
      policy_name: "dwa"
      controller_frequency: 5.0
      control_frequency: 5.0
      costmap_layers:
        - obstacle_layer
        - inflation_layer
  additional_launch_files:
    - package: nav2_pybind_sicnav_controller
      launch: costmap_converter.launch.py


# Real-time acados variant. Prereqs: ACADOS_SOURCE_DIR exported in the launch
# env, the warmstart-linsol vendored patches, HSL installed (libhsl.so on the
# default search path), env.config `[env] wild=true`, and policy.outdoor_robot_setting
# True (SICNavController sets this automatically). With those, de-risk
# measured warm p95 ≈ 12 ms per predict() — comfortably real-time at 10 Hz with
# ~8× headroom. Without HSL the no-HSL fallback was ~277 ms (~3.6 Hz ceiling).
SICNAV_ACADOS:
  nav_template:
    name: only_controller
    controller:
      name: sicnav
      policy_name: "sicnav_acados"
      # 3 Hz: the no-HSL acados solve measured ~300-440 ms live (HSL/ma57 cannot
      # accelerate the blocksqp warmstart — casadi has no ma57 Linsol plugin).
      # control_frequency MUST equal controller_frequency (it is the MPC dt);
      # 5 Hz overran the 200 ms budget every cycle, breaking MPC timing. Raise
      # back toward 5 Hz only if the diag log shows solves under ~330/200 ms.
      controller_frequency: 10.0
      control_frequency: 10.0
      costmap_layers:
        - obstacle_layer
        - inflation_layer
  additional_launch_files:
    - package: nav2_pybind_sicnav_controller
      launch: costmap_converter.launch.py

