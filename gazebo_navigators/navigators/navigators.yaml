# Experiment Controllers Configuration File
# This file defines various experiment controllers and their configurations.

# List of available navigators
navigators:
  - DWA
  - DWA_social_costmap
  - social_DWA
  - DWB
  - DWB_social_costmap
  - social_DWB
  - MPPI
  - MPPI_social_costmap
  - social_MPPI
  - ORCA
  - PURE_SFM
  - SARL
  - CADRL
  - MPC_base
  - MPC_base_no_costs
  - MPC_base_no_angle_cost
  - MPC_base_no_proxemics_cost
  - MPC_base_no_work_cost
  - MPC_base_only_work_cost
  - MPC_base_only_angle_cost
  - MPC_base_only_proxemics_cost
  - MPC_social_motion
  - MPC_social_motion_no_costs
  - MPC_social_motion_only_angles_cost
  - MPC_social_motion_only_proxemics_cost
  - MPC_social_motion_only_work_cost
  - MPC_social_motion_no_angles_cost
  - MPC_social_motion_no_proxemics_cost
  - MPC_social_motion_no_work_cost
  - MPC_enlarged_state
  - MPC_enlarged_state_no_angle_cost
  - MPC_enlarged_state_no_proxemics_cost
  - MPC_enlarged_state_no_work_cost
  - MPC_enlarged_state_only_work_cost
  - MPC_enlarged_state_only_angle_cost
  - MPC_enlarged_state_only_proxemics_cost

# Configuration for each experiment controller
# Each controller specifies a base algorithm and optional features.
# Features include social costmap layers and social plugins.
# The configurations can be adjusted as needed for different experiments.
# if a feature is not specified, it defaults to false.

DWA:
  nav_template: 
    name: only_controller
    controller:
      name: dwa
      costmap_layers:
        - obstacle_layer
        - inflation_layer

DWA_social_costmap:
  nav_template: 
    name: only_controller
    controller:
      name: dwa
      costmap_layers:
        - obstacle_layer
        - social_layer
        - inflation_layer

social_DWA:
  nav_template: 
    name: only_controller
    controller:
      name: dwa
      social_plugin: true
      costmap_layers:
        - obstacle_layer
        - inflation_layer

