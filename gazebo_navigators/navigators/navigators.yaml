# Configuration for each experiment controller
# Each controller specifies a base algorithm and optional features.
# Features include social costmap layers and social plugins.
# The configurations can be adjusted as needed for different experiments.
# if a feature is not specified, it defaults to false.
#
# Optional per-navigator launch helpers:
# additional_launch_files:
#   - "my_pkg my_launch.py arg:=value"
#   - package: my_pkg
#     launch: my_launch.py
#     arguments:
#       arg: value
#
# Optional replacement for the default gazebo_test Nav2 bringup:
# navigation_launch:
#   package: my_nav_pkg
#   launch: my_nav.launch.py
#   arguments:
#     map: "{map}"
#     params_file: "{params_file}"

DWA:
  nav_template: 
    name: only_controller
    controller:
      name: dwa
      costmap_layers:
        - obstacle_layer
        - inflation_layer

DWA_social_costmap:
