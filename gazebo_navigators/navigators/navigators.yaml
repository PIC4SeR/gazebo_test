# Experiment Controllers Configuration File
# This file defines various experiment controllers and their configurations.

# List of available navigators
navigators:
  - DWA
  - DWA_social_costmap
  - social_DWA
  - DWB
  - DWB_social_costmap
  - social_DWB
  - MPPI
  - MPPI_social_costmap
  - social_MPPI
  - ORCA
  - PURE_SFM
  - MPC_enlarged_state
  - MPC_social_motion

# Configuration for each experiment controller
# Each controller specifies a base algorithm and optional features.
# Features include social costmap layers and social plugins.
# The configurations can be adjusted as needed for different experiments.
# if a feature is not specified, it defaults to false.

DWA:
  nav_template: 
    name: only_controller
    controller:
      name: dwa
      costmap_layers:
        - obstacle_layer
        - inflation_layer

DWA_social_costmap:
  nav_template: 
    name: only_controller
    controller:
      name: dwa
      costmap_layers:
        - obstacle_layer
        - social_layer
        - inflation_layer

social_DWA:
  nav_template: 
    name: only_controller
    controller:
      name: dwa
      social_plugin: true
      costmap_layers:
        - obstacle_layer
        - inflation_layer

DWB:
  nav_template: 
    name: only_controller
    controller:
      name: dwb
      costmap_layers:
        - obstacle_layer
        - inflation_layer

